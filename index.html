<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 Skills Test</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <style>
        body {
        background-image: url(https://w0.peakpx.com/wallpaper/459/890/HD-wallpaper-squares-white-geometric-shapes-white-aesthetic.jpg);
        background-repeat: no-repeat;
        background-size: cover;
        }

     </style>
</head>
<body>
    <body>

    <br><br>

    <center>
    <form class="col-lg-5">
    <div class="container col-lg-6 fs-3 form-control bg-light text-dark">
        <div class="container col-lg-6 fs-4">
            <br>
            <h1 id="title"><b>LOGIN PAGE</b></h1>
        </div>
            <br>
            <div class="container mt-4">
                <div class="overlay-box text-dark">

  

                        <details class="ontoggle">
                            <summary>CLICK FOR INSTRUCTIONS</summary>
                            <br>
                            <h5 class="fw-bold mb-3" id="instructions">Fill in the required details, click the checkbox, and click "SUBMIT."</h5>
                            </details>

                </div>
                <br>
            </div>
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <h4>USERNAME</h4>
                    <input type="text" class="form-control" id="Username" placeholder="Enter...">
                    <br>
                    <h4>PASSWORD</h4>
                    <input type="password" class="form-control" id="Password" placeholder="Enter...">
                    <br>
                <input type="checkbox" id="checkboxID" class="form-check-input">
                <label for="checkboxID" class="form-check-label">Stay logged in</label>
                <br>
                <br>
                    <button type="submit" class="btn btn-dark text-light" onclick="login()">SUBMIT</button>
                    <button type="reset" class="btn btn-dark text-light">RESET</button>
                </div>
            </div>
            <br>
    </div>
    </form>
    <script>
        function login() {
            let username = document.getElementById("Username").value;
            let password = document.getElementById("Password").value;

            let check = document.getElementById("checkboxID").checked;

            switch (check) {
                case true:
                    break;
                case false:
                    break;
            }

            let correctUsername = "isaiasberdin";
            let correctPassword = "067894";

            if (!username || !password) {
                alert("Please fill in both fields.");
                return false;
            }
             if (username === correctUsername && password === correctPassword) {
                alert("Welcome, " + username + "!");
             } else {
                alert("Incorrect username and/or password.");
             }

             return false;
 
        }
    </script>
</center>
</body>
    
</body>
</html>
